# Company readers can read the site; management and WeRSS require an administrator.
location = /_gamehot_auth {
    internal;
    proxy_pass http://127.0.0.1:3000/api/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
}
location = /_gamehot_site_auth {
    internal;
    proxy_pass http://127.0.0.1:3000/api/auth/site-check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
}
location = /sso/callback {
    # The browser reads the token, removes it from its address bar, then posts it to the API.
    # Neither access/error logs nor the upstream request receive the query string.
    access_log off;
    error_log /dev/null crit;
    set $args "";
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Referer "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
}
location = /werss { return 302 /werss/; }
location ^~ /werss/ {
    auth_request /_gamehot_auth;
    error_page 401 = @werss_login;
    proxy_pass http://127.0.0.1:8001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $gamehot_connection_upgrade;
    proxy_redirect ~^(/(?!werss/).*)$ /werss$1;
    proxy_read_timeout 650s;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
location @werss_login {
    add_header X-Gamehot-Auth required always;
    add_header Cache-Control "no-store" always;
    if ($http_accept !~* "text/html") { return 401; }
    return 302 /login?return=%2Fwerss%2F;
}
# Login and hashed build assets are reachable before authentication.
location ~ ^/((?:login|admin/login)(?:\.data)?$|api/auth/|assets/|favicon\.ico$) {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header Referer "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
}
location ~ ^/(admin(?:/|\.data$|$)|api/admin(?:/|$)) {
    auth_request /_gamehot_auth;
    error_page 401 = @admin_login;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
location / {
    auth_request /_gamehot_site_auth;
    error_page 401 = @gamehot_login;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
location @admin_login {
    add_header Cache-Control "no-store" always;
    if ($http_accept !~* "text/html") { return 401; }
    return 302 /login?return=%2Fadmin;
}
location @gamehot_login {
    add_header Cache-Control "no-store" always;
    if ($http_accept !~* "text/html") { return 401; }
    return 302 /login?return=%2F;
}
