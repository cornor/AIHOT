# Included inside the TLS server. HTTP redirects to HTTPS and serves the ACME challenge only.
location = /_gamehot_auth {
    internal;
    proxy_pass http://127.0.0.1:3000/api/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
}
location = /werss { return 302 /werss/; }
location ^~ /werss/ {
    auth_request /_gamehot_auth;
    error_page 401 = @werss_login;
    proxy_pass http://127.0.0.1:8001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $gamehot_connection_upgrade;
    proxy_redirect ~^(/(?!werss/).*)$ /werss$1;
    proxy_read_timeout 650s;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
location @werss_login {
    add_header X-Gamehot-Auth required always;
    add_header Cache-Control "no-store" always;
    if ($http_accept !~* "text/html") { return 401; }
    return 302 /admin/login?return=%2Fwerss%2F;
}
location / {
    include /opt/gamehot/private/site-access.conf;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;
}
# Login and its assets remain reachable; all content and data interfaces require an admin session.
location ~ ^/(admin(/|$)|api/auth(/|$)|assets/|favicon\.ico$) {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
}
location @gamehot_login {
    add_header Cache-Control "no-store" always;
    if ($http_accept !~* "text/html") { return 401; }
    return 302 /admin/login;
}
