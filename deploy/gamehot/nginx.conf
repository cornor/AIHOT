map $http_upgrade $gamehot_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name gamehot.paoyou.com;
    access_log off;
    error_log /var/log/nginx/gamehot-error.log error;
    location /.well-known/acme-challenge/ { root /var/www/gamehot-acme; }
    # Never echo a login token into an HTTP redirect.
    location = /sso/callback { return 302 https://gamehot.paoyou.com/login; }
    location / { return 308 https://gamehot.paoyou.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name gamehot.paoyou.com;
    ssl_certificate /etc/nginx/ssl/paoyou.com.pem;
    ssl_certificate_key /etc/nginx/ssl/paoyou.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/gamehot-error.log error;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    include /opt/gamehot/deploy/gamehot/nginx-locations.conf;
}
